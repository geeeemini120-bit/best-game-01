<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VOIDHARVEST — a make.fun bounty game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #04060f; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  #status { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="VOIDHARVEST game board"></canvas>
<div id="status" aria-live="polite"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
